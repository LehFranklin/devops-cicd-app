name: CI

# Run this workflow every time code is pushed to main, or on a pull request targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN needs permission to push images to GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ github.repository }}   # e.g. lehfranklin/devops-cicd-app

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test   # only run this job if the test job succeeded
    # Only push images on actual commits to main, not on pull requests
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
- name: Set lowercase image name
        run: echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME_LOWER}}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME_LOWER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


