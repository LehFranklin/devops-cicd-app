apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-cicd-app
  namespace: default
  labels:
    app: devops-cicd-app
spec:
  selector:
    matchLabels:
      app: devops-cicd-app
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
          targetLabel: rollouts_pod_template_hash
